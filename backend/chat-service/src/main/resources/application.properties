## Server
server.port=${SERVER_PORT:8082}

## MongoDB
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/chat_service}
spring.data.mongodb.auto-index-creation=${MONGO_AUTO_INDEX:true}

## RabbitMQ (RMQ)
spring.rabbitmq.host=${RMQ_HOST:localhost}
spring.rabbitmq.port=${RMQ_PORT:5672}
spring.rabbitmq.username=${RMQ_USERNAME:guest}
spring.rabbitmq.password=${RMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RMQ_VHOST:/}

## Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}

## PostgreSQL (Posgres)
spring.datasource.url=jdbc:postgresql://localhost:5432/ripple_db
spring.datasource.username=sreejapaluri
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

## JPA / Hibernate (used with Postgres)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

## Logging
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.ripple.chat_service=${LOG_LEVEL_APP:DEBUG}
logging.pattern.console=${LOG_CONSOLE_PATTERN:%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n}
